[package]
name = "gcm-sst"
version = "0.1.0"
description = """
TODO
"""
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/gcm-sst"
keywords = [ "gcm", "gcm-sst" ]
categories = [ "cryptography", "no-std", "no-std::no-alloc" ]

[lints]
workspace = true

[features]
default = []

# Enable allocations.
alloc = []

# Enable Rust Crypto integration.
rust-crypto = [
	"dep:aes",
]

# Enable `std`.
std = []

[dependencies]
aead = { version = "0.5" }
aes = { version = "0.8", optional = true }
cfg-if = { version = "1" }
cipher = { version = "0.4" }
crypto-common = { version = "0.1" }
ctr = { version = "0.9" }
generic-array = { workspace = true }
hex = { version = "0.4", features = ["serde"] } # TODO
hybrid-array = { version = "0.2.0-rc.6" }
inout = { version = "0.1" }
polyhash = { version = "0.2" }
subtle = { workspace = true }
typenum = { workspace = true }

[dev-dependencies]
gcm-sst = { path = ".", features = ["rust-crypto"] }
aes = { version = "0.8" }
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
