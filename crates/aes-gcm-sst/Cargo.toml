[package]
name = "aes-gcm-sst"
version = "0.1.0"
description = """
 TODO
"""
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/aes-gcm-sst"
keywords = [ "aes-gcm", "aes-gcm-sst" ]
categories = [ "cryptography", "no-std", "no-std::no-alloc" ]

[features]
default = []

# Enable allocations.
alloc = [
	"cipher/alloc",
	"ctr/alloc",
	"gcm-sst/alloc",
]

# Internal only, do not use.
testing = []

# Enable `std`.
std = [
	"alloc",

	"cipher/std",
	"ctr/std",
	"gcm-sst/alloc",
]

[dependencies]
aead = { version = "0.5", default-features = false }
aes = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }
ctr = { version = "0.9", default-features = false }
gcm-sst = { version = "0.1.0", path = "../gcm-sst", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
aes-gcm-sst = { path = "." }
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
